name: "ghav before: CI"
"on":
  push:
    branches:
      - ghav/dev/715
    paths:
      - .ghav/before
permissions:
  contents: read
  packages: read
jobs:
  unit-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        group:
          - app
          - dom
          - editor
          - fig
          - render
          - scene
          - vue
    name: Engine tests — ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          lfs: "true"
      - name: Build shared Core test dependency
        run: bun --filter @open-pencil/core build
      - name: Run ${{ matrix.group }} engine tests
        shell: bash
        run: |
          mapfile -t test_files < <(bun tools/unit-tests/ghav-before/list.ts "${{ matrix.group }}")
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No tests found for shard ${{ matrix.group }}"
            exit 0
          fi
          bun test "${test_files[@]}"
        env:
          BUN_HEAVY_TESTS: "false"
