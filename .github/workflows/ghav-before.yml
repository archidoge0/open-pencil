name: "ghav before: CI"
"on":
  push:
    branches:
      - ghav/dev/332
    paths:
      - .ghav/before
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          lfs: "true"
      - name: Format check
        run: bun run format:check
      - name: Lint & typecheck
        run: bun run check
      - name: Unit tests
        run: bun test tests/engine/
        env:
          BUN_HEAVY_TESTS: "false"
      - name: Copy-paste detection
        run: bun run test:dupes
